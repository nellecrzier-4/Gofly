org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Ulangi permintaan repositori yang gagal sementara (429/5xx) alih-alih
# menggagalkan build: CI sempat mati karena "429 Too Many Requests".
org.gradle.internal.repository.max.tentatives=5
org.gradle.internal.repository.initial.backoff=2000
