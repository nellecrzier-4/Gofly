name: Android CI

# Lint + unit test + build debug untuk setiap PR dan setiap push ke main yang
# menyentuh proyek Android. Artefak laporan diunggah walau langkah sebelumnya
# gagal supaya kegagalan bisa didiagnosis dari tab Actions.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, unit test, build debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner GitHub sudah membawa Android SDK. Jangan pakai
      # android-actions/setup-android: aksinya memanggil
      # `sdkmanager "tools"`, dan paket `tools` sudah tidak ada di repositori
      # SDK, sehingga langkah itu gagal sebelum Gradle pernah berjalan.
      # Di sini hanya platform + build-tools yang dipastikan ada.
      - name: Siapkan Android SDK
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then
            MANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -r | head -1)
          fi
          yes | "$MANAGER" --licenses > /dev/null 2>&1 || true
          "$MANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$SDK" > android/local.properties

      # Cache Gradle (wrapper + cache dependensi) antar-jalan.
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pastikan gradlew bisa dieksekusi
        run: chmod +x android/gradlew

      # Aturan keras proyek: tidak boleh ada WebView / Custom Tabs / jembatan JS.
      # Semua UI dibangun dengan Jetpack Compose dan jaringan lewat OkHttp.
      #
      # Komentar dan teks yang hanya MENYEBUT "WebView" (mis. "no WebView")
      # diizinkan; yang ditolak adalah pemakaian nyata. Baris komentar disaring,
      # lalu baris yang secara eksplisit menyatakan larangan juga disaring.
      - name: Tolak penggunaan WebView
        run: |
          set -eu
          raw=$(grep -rniE --include="*.kt" --include="*.java" --include="*.xml" "webview|addJavascriptInterface|androidx\.webkit|customtabs" android/app/src/main || true)
          if [ -z "$raw" ]; then
            echo "Tidak ada rujukan WebView."
            exit 0
          fi
          bad=$(printf '%s\n' "$raw" \
            | grep -viE "no webview|tanpa webview|tidak ada webview|without webview|bukan webview|webview usage is forbidden" \
            | grep -vE "^[^:]+:[0-9]+:[[:space:]]*(//|/?\*|<!--)" || true)
          if [ -n "$bad" ]; then
            echo "Pemakaian WebView terdeteksi:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "Hanya komentar yang menyebut WebView — tidak ada pemakaian."

      - name: Lint, unit test, dan build debug
        working-directory: android
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx3g

      - name: Unggah laporan lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
            android/app/build/reports/lint-results-debug.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Unggah laporan unit test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Unggah artefak APK
        uses: actions/upload-artifact@v4
        with:
          name: gofly-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # APK debug sangat lambat untuk Compose (tanpa R8/baseline profile).
      # Pasang APK release ini untuk merasakan kecepatan sebenarnya.
      - name: Build APK release
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx3g

      - name: Unggah APK release
        uses: actions/upload-artifact@v4
        with:
          name: gofly-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
