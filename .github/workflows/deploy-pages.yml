name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy situs statis
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan artefak situs
        run: |
          mkdir -p site/js site/icons
          cp index.html styles.css manifest.webmanifest sw.js offline.html site/
          cp js/api.js js/app.js js/qr.js site/js/
          cp icons/icon.svg icons/icon-maskable.svg icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png site/icons/
          touch site/.nojekyll

      - name: Konfigurasi Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
